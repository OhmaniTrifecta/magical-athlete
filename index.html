function fit(){const w=$('#wrap'),b=$('#board'),s=Math.min(1,(innerWidth-24)/1100);b.style.transform=`scale(${s})`;b.style.margin=s<1?'0':'0 auto';w.style.height=b.offsetHeight*s+'px'}
addEventListener('resize',fit);
function trip(r){if(r.trip||r.fin||r.out)return;r.trip=1;r.fallAt=Date.now();sfx('trip')}
const psp=(r,w)=>{const el=Date.now()-(r.fallAt||0),fl=r.trip&&el<650*SPD;return `<span class="pw ${G.hop===r?'hop':''} ${r.trip?(fl?'fall':'tr'):''}"${fl?` style="animation-delay:-${el}ms"`:''}>${pawn(r.id,w)}</span>`};
function render(){
 const wild=G.board=='wild',al=alive();$('#board').style.setProperty('--hd',.26*SPD+'s');$('#board').style.setProperty('--fd',.65*SPD+'s');
 let h=`<div class="start"><span>START</span>${al.filter(r=>r.pos==0).map(r=>psp(r,28)).join('')}</div><div class="fin">🏁<br>FINISH${G.placed.map((r,i)=>`<div>${['🥇','🥈'][i]}${pawn(r.id,26)}</div>`).join('')}</div><div class="mid" style="--gr:${wild?'#6b3fb0':'#4a9b3c'}">${wild?'WILD WILDS':'MILD MILE'}</div>`;
 for(let i=1;i<FIN;i++){let row,col;if(i<=12){row=1;col=i+3}else if(i<=14){row=i-11;col=15}else{row=4;col=30-i}
  const s=wild&&WILD[i],k=wild?WCOL[i]:'rpygb'[i%5],lab=wild?(s?(s.s?'★1':s.t?'TRIP!':(s.a>0?'→':'←')+Math.abs(s.a)):''):(i%5==0?i:''),on=al.filter(r=>r.pos==i),w=on.length>3?20:on.length>1?28:36;
  h+=`<div class="sq" style="grid-area:${row}/${col};background:${COL[k]}">${lab!==''?`<span class="ic" style="font-size:${String(lab).length>3?19:36}px">${lab}</span>`:''}${on.map(r=>psp(r,w)).join('')}</div>`}
 $('#board').innerHTML=h;fit();
 $('#sc').innerHTML=G.pl.map(p=>`<div class="pl" style="--c:${p.col}">${p.n}${p.ai?' 🤖':''}<br><b>${p.pts}</b> pts</div>`).join('');
 $('#chips').innerHTML='<span class="hd">Prize chips:</span>'+[0,1,2,3].map(i=>`<div class="cp${i==G.n?' cur':''}">Race ${i+1} · ${i%2?'Wild':'Mild'}<br>🥇 ${GOLD[i]} &nbsp; 🥈 ${SIL[i]}</div>`).join('');
 $('#strip').innerHTML=G.rs.map(r=>`<div class="rc" style="--c:${own(r).col}" onclick="powers()">${pawn(r.id,22)}${R[r.id].n}${r.trip?' 🌀':''}${r.fin?' #'+r.fin:''}${r.out?' ❌':''}</div>`).join('')}
const F={1:[0,0],2:[0,-90],5:[0,90],6:[0,180],3:[-90,0],4:[90,0]};let cum=0;
async function rollDie(p){const v=rnd(6)+1,d=$('#die');d.style.setProperty('--dc',p.dc);d.style.transitionDuration=SPD+'s';cum+=720;const[x,y]=F[v];d.style.transform=`rotateX(${x+cum}deg) rotateY(${y+cum}deg)`;await sleep(1100);return v}
function checkEnd(){if(G.placed.length>=2)G.over=1;else if(alive().length<=1){const l=alive()[0];if(l){l.fin=G.placed.length+1;G.placed.push(l)}G.over=1}}
function finish(r){r.fin=G.placed.length+1;G.placed.push(r);sfx('win');log(`🏁 ${nm(r)} finishes in place ${r.fin}!`);
 if(r.fin==1){const mm=[...alive(),r].find(o=>eid(o)=='mind'&&o.mm===r);if(mm){log('🕵️ Mastermind called it! The race ends now.');if(mm===r)G.placed.push(r);else{mm.fin=2;G.placed.push(mm)}G.over=1;return}}
 checkEnd()}
const lpg=()=>{if(G.over)return 1;if(++G.ch>30){if(!G.cl){G.cl=1;log('♾️ Endless chain reaction: the loop runs once, then stops')}return 1}return 0};
async function fire(r){if(lpg())return;for(const s of has('scooch',r)){log('🛷 Scoocher scooches 1');await mv(s,1);await land(s)}}
async function mv(r,d){if(lpg())return;if(!d||r.fin||r.out||G.over)return;const a=r.pos,dir=d>0?1:-1,lp=eid(r)=='leap',rd=[];let rem=Math.abs(d),cur=a,path=[],skips=0,over=0;
 for(const s of has('suck',r))if(s.pos==a&&await dec(s,`<h2>Suckerfish: SUCKER!</h2>Move with ${nm(r)}?`,['Hitch a ride','No'],()=>d>0?0:1)==0){rd.push(s);log(`🐟 Suckerfish rides along with ${nm(r)}`)}
 while(rem>0){cur+=dir;if(cur<0){cur=0;break}if(cur>=FIN){over=rem>1;path.push(FIN);cur=FIN;break}
  if(lp&&alive().some(o=>o!==r&&o.pos==cur)){skips++;path.push(cur);continue}path.push(cur);rem--}
 const b=path.length?path[path.length-1]:a;if(b==a)return;
 if(over&&has('stickler',r).length){log(`📏 Stickler: ${nm(r)} needs the exact roll to finish`);await fire(has('stickler',r)[0]);return}
 const ps=alive().filter(o=>o!==r&&!rd.includes(o)&&(d>0?o.pos>a&&o.pos<b:o.pos<a&&o.pos>b));
 for(const p of path){if(p>=FIN)break;r.pos=p;rd.forEach(s=>s.pos=p);G.hop=r;sfx('hop');render();await sleep(230)}G.hop=null;
 if(b>=FIN){r.pos=FIN;rd.forEach(s=>s.pos=FIN);finish(r);for(const s of rd)if(!G.over||!s.fin){if(!s.fin&&G.placed.length<2)finish(s)}render();return}
 r.rd=rd;const bb=has('baby',r).find(x=>x.pos>0&&x.pos==r.pos);if(bb){r.pos--;rd.forEach(s=>s.pos=r.pos);log('👶 Huge Baby: no room on her space')}
 let tr=0;for(const o of ps){const e=eid(o);if(e=='banana'){[r,...rd].forEach(trip);tr=1;log(`🍌 ${nm(r)} slips on Banana and trips!`);await fire(o)}
  if(e=='centaur'){log(`🐴 Centaur hoofwhacks ${nm(r)}!`);await fire(o);await mv(r,-Math.min(2,r.pos))}}
 render();if(tr)await sleep(650);await sleep(120);for(let k=0;k<skips;k++)await fire(r)}
async function land(r,n=0,tog=[]){if(lpg())return;if(r.fin||r.out||G.over||n>8)return;const rd=r.rd||[];r.rd=null;let e=eid(r),tp=0;
 const bb=has('baby',r).find(x=>x.pos>0&&x.pos==r.pos&&!tog.includes(x));if(bb){r.pos=bb.pos-1;log(`👶 Huge Baby: ${nm(r)} is put behind her`);render()}
 let sh=alive().filter(o=>o!==r&&o.pos==r.pos&&!tog.includes(o));
 if(e=='baby'&&r.pos>0&&sh.length){for(const o of sh){o.pos=r.pos-1;if(eid(o)=='banana'){trip(r);tp=1;log('🍌 Huge Baby passes Banana and trips!')}}log('👶 Huge Baby pushes everyone behind her');sh=[];render()}
 if(e=='baba'&&sh.length){sh.forEach(trip);tp=1;log('🧙 Baba Yaga trips everyone on her space');await fire(r)}
 else{const by=sh.find(o=>eid(o)=='baba');if(by){trip(r);tp=1;log(`🧙 ${nm(r)} is tripped by Baba Yaga`);await fire(by)}}
 if(tp){render();await sleep(650)}
 if(e=='mouth'&&sh.length==1){sh[0].out=1;log(`😁 M.O.U.T.H. eliminates ${nm(sh[0])}!`);await fire(r);checkEnd();render();if(G.over)return}
 sh=alive().filter(o=>o!==r&&o.pos==r.pos&&!tog.includes(o));
 for(const d of alive().filter(o=>eid(o)=='duel'&&(o===r?sh.length:sh.includes(o)))){if(n>2||d.fin||d.out||G.over)continue;const o=d===r?sh[0]:r;if(!o||o.pos!=d.pos||o.fin||o.out)continue;
  if(await dec(d,`<h2>Duelist</h2>${nm(d)}: shout DUEL! at ${nm(o)}?`,['DUEL!','Pass'],()=>0)!=0)continue;
  log(`⚔️ ${nm(d)} challenges ${nm(o)} to a DUEL!`);const x=await rollDie(own(d)),y=await rollDie(own(o));log(`⚔️ ${x} vs ${y}: ${x>=y?'Duelist':'challenger'} wins and moves 2`);await fire(d);await mv(x>=y?d:o,2);await land(x>=y?d:o,n+1)}
 if(r.fin||r.out||G.over)return;
 sh=alive().filter(o=>o!==r&&o.pos==r.pos&&!tog.includes(o));
 if(sh.length==1)for(const m of has('romantic')){log('💕 Romantic is moved by love: +2');await fire(m);await mv(m,2);await land(m,n+1)}
 const s=G.board=='wild'&&WILD[r.pos];
 if(s&&!r.fin&&!r.out&&!G.over){if(s.s){own(r).pts++;sfx('star');log(`★ ${nm(r)} takes a bronze point chip`)}
  if(s.t&&!r.trip){trip(r);log(`🌀 ${nm(r)} trips!`);render();await sleep(650)}
  if(s.a){log(`${nm(r)} follows the arrow (${s.a>0?'+':''}${s.a})`);await mv(r,s.a);await land(r,n+1)}}
 for(const x of rd)await land(x,n+1,[r,...rd.filter(y=>y!==x)])}
async function tin(r){const p=own(r),sp=r.pos;render();const E0=eid(r);
 $('#info').innerHTML=`<span class="hd" style="font-size:26px;color:${p.col}">${p.n}${p.ai?' 🤖':''}</span><br>${pawn(r.id,40)} <b>${R[r.id].n}${r.as?' → '+R[r.as].n:''}</b>: ${R[E0].p}<br><small>${R[E0].d}</small>`;
 const rs=alive(),mn=Math.min(...rs.map(o=>o.pos)),mx=Math.max(...rs.map(o=>o.pos)),bt=$('#roll');
 if(p.ai)await sleep(750);else{bt.style.display='';bt.textContent=r.trip?'Recover (skip move)':'ROLL!';await new Promise(ok=>bt.onclick=ok);bt.style.display='none'}
 const e=eid(r);
 if(e=='mind'&&r.mm===undefined){const o=alive(),i=await dec(r,'<h2>Mastermind</h2>Predict the winner!',o.map(nm),()=>rnd(o.length));r.mm=o[i];log(`🕵️ ${nm(r)} predicts ${nm(o[i])} will win`);await fire(r)}
 if(e=='loser'&&r.pos==mn&&rs.filter(o=>o.pos==mn).length==1){p.pts++;log(`💜 ${nm(r)} collects a point chip`);await fire(r)}
 if(e=='cheer'){log('📣 Cheerleader cheers for last place!');for(const o of rs.filter(o=>o.pos==mn)){await mv(o,2);await land(o)}await mv(r,1);await land(r);await fire(r)}
 if(e=='hare'&&r.pos==mx&&rs.filter(o=>o.pos==mx).length==1){log('🐇 Hare is alone in the lead: hubris! Skips main move');await fire(r);return}
 if(e=='party'){log('🎉 Party Animal pulls everyone closer!');const o=rs.filter(x=>x!==r&&x.pos!=r.pos);for(const x of o)await mv(x,x.pos<r.pos?1:-1);for(const x of o)await land(x);await fire(r)}
 if(e=='third'){const al=alive(),sp2=[...new Set(al.map(o=>o.pos))].filter(x=>x!=r.pos&&al.filter(o=>o.pos==x).length==2);
  if(sp2.length){const t=Math.max(...sp2);if(await dec(r,`<h2>Third Wheel</h2>Warp to space ${t}?`,['Warp','No'],()=>t>r.pos?0:1)==0){r.pos=t;log(`Third Wheel warps to space ${t}`);G.hop=r;render();await sleep(450);G.hop=null;await fire(r);await land(r)}}}
 if(e=='hypno'){const o=alive().filter(x=>x!==r&&x.pos!=r.pos);if(o.length){const ld=o.reduce((a,b)=>b.pos>a.pos?b:a);
  const i=await dec(r,'<h2>Hypnotist</h2>Warp which racer to your space?',[...o.map(nm),'Nobody'],()=>ld.pos>r.pos?o.indexOf(ld):o.length);
  if(i<o.length){o[i].pos=r.pos;log(`🌀 Hypnotist warps ${nm(o[i])} to their space`);G.hop=o[i];render();await sleep(450);G.hop=null;await fire(r);await land(o[i])}}}
 if(G.over||r.fin||r.out)return;
 if(r.trip){r.trip=0;r.fallAt=0;log(`${nm(r)} recovers from the trip and skips their main move`);render();return}
 if(e=='flip'){const o=alive().filter(x=>x!==r&&x.pos!=r.pos);if(o.length){const ld=o.reduce((a,b)=>b.pos>a.pos?b:a);
  const i=await dec(r,'<h2>Flip Flop</h2>Skip rolling and swap spaces with:',[...o.map(nm),'Roll normally'],()=>ld.pos>r.pos?o.indexOf(ld):o.length);
  if(i<o.length){[r.pos,o[i].pos]=[o[i].pos,r.pos];log(`🩴 Flip Flop swaps with ${nm(o[i])}`);G.hop=r;render();await sleep(500);G.hop=null;await fire(r);await land(r);await land(o[i]);return}}}
 let roll=0,amt,pred=0,ex=0;
 if(e=='legs'&&await dec(r,'<h2>Legs: JOG?</h2>Skip rolling and move 5?',['Jog (move 5)','Roll normally'],()=>0)==0){amt=5;log('🏃 Legs jogs 5');await fire(r)}
 else{if(e=='genius')pred=1+await dec(r,'<h2>Genius</h2>Predict your roll!',[1,2,3,4,5,6],()=>rnd(6));
  roll=await rollDie(p);log(`${nm(r)} rolled a ${roll}`);
  if(e=='magic')for(let k=0;k<2;k++){if(await dec(r,`<h2>Magician rolled ${roll}</h2>Reroll? (${2-k} left)`,['Reroll','Keep'],()=>roll<=2?0:1)!=0)break;await fire(r);roll=await rollDie(p);log(`✨ Magician rerolls: ${roll}`)}
  if(has('dice').length&&await dec(r,`<h2>Dicemonger table: reroll?</h2>${nm(r)} rolled ${roll}.`,['Reroll','Keep'],()=>roll<=2?0:1)==0){for(const d of has('dice',r)){log('🎲 Dicemonger moves 1 first');await fire(d);await mv(d,1);await land(d)}roll=await rollDie(p);log(`🎲 Reroll: ${roll}`)}
  if(pred&&roll==pred){ex=1;log('🧠 Genius predicted right: extra turn!');await fire(r)}
  const sk=alive().find(o=>eid(o)=='skip');if(roll==1&&sk){G.sk=sk;log('⚓ Skipper goes next!');await fire(sk)}
  amt=roll;
  if(e=='sisy'&&roll==6){log('🪨 Sisyphus rolled a 6: back to the Start, and loses a point chip');if(p.pts>0)p.pts--;r.pos=0;G.hop=r;render();await sleep(450);G.hop=null;await fire(r);return}
  if(e=='alch'&&roll<3){amt=4;log('⚗️ Alchemist transmutes the roll into 4');await fire(r)}
  if(e=='rocket'&&await dec(r,`<h2>Rocket Scientist rolled ${roll}</h2>Kablooey: double it to ${roll*2} (and trip)?`,['Kablooey!','No thanks'],()=>roll>=4?0:1)==0){amt=roll*2;r.rk=1;await fire(r)}
  for(const l of has('lackey',r))if(roll==6){log('Lackey hustles 2 first');await fire(l);await mv(l,2);await land(l)}
  const iw=has('inch',r)[0];if(roll==1&&iw){log('🐛 Inchworm wriggles; the roll of 1 is skipped');await fire(iw);await mv(iw,1);await land(iw);return}}
 const src=[];if(e=='hare'){amt+=2;src.push(r)}if(e=='blimp'){amt+=sp<15?3:-1;src.push(r)}
 if(e=='party'){const k=alive().filter(o=>o!==r&&o.pos==r.pos).length;amt+=k;if(k)src.push(r)}
 for(const c of alive().filter(o=>eid(o)=='coach'&&o.pos==r.pos)){amt++;src.push(c)}for(const g of has('gunk',r)){amt--;src.push(g)}
 amt=Math.max(0,amt);log(`${nm(r)} moves ${amt}`);await mv(r,amt);for(const s of src)await fire(s);
 if(r.rk){r.rk=0;trip(r);log('💥 Kablooey! Rocket Scientist trips');render();await sleep(650)}
 await land(r);return ex}
async function turn(r){const s=r.pos,x=await tin(r);
 if(!r.fin&&!r.out&&!G.over&&Math.abs(r.pos-s)<=1)for(const h of has('heckler',r)){log(`📢 Heckler mocks ${nm(r)}: +2!`);await mv(h,2);await land(h)}return x}
const pick=(t,ids)=>new Promise(res=>{const m=$('#md');m.className='on';m.innerHTML=`<div class="box"><h2>${t}</h2><div class="hand">${ids.map(card).join('')}</div></div>`;m.onclick=e=>{const c=e.target.closest('.card');if(c){m.className='';m.innerHTML='';res(c.dataset.id)}}});
async function race(){G.over=0;G.tc=0;G.ch=0;G.best=0;G.sk=null;G.placed=[];G.rs=[];G.board=G.n%2?'wild':'mild';$('#log').innerHTML='';render();
 const picks=[];for(let i=0;i<G.pl.length;i++){const p=G.pl[i];let id;
  if(p.ai)id=p.hand[rnd(p.hand.length)];else{await modal(`<h2>${p.n}</h2>Pass the device: only ${p.n} should look!`,[`I’m ${p.n}`]);id=await pick(`${p.n}: choose your racer`,p.hand)}
  p.hand=p.hand.filter(h=>h!=id);picks.push({id,o:i,pos:0,trip:0,fin:0,out:0})}
 G.rs=picks;
 for(const r of picks)if(r.id=='egg'||r.id=='twin'){const pool=r.id=='egg'?G.deck.splice(0,3):[...new Set(G.winners)];
  if(pool.length){let c;if(own(r).ai)c=pool[rnd(pool.length)];else{await modal(`<h2>${own(r).n}</h2>Pass the device: ${R[r.id].n} power!`,[`I’m ${own(r).n}`]);c=await pick(`${R[r.id].n}: pick a racer to become`,pool)}
   r.as=c;if(r.id=='egg')G.deck.push(...pool.filter(x=>x!=c));log(`${R[r.id].n} becomes ${R[c].n}`)}else log(`${R[r.id].n} has nobody to copy`)}
 for(const r of picks)if(base(r)=='sisy'){own(r).pts+=4;log('🪨 Sisyphus takes 4 point chips')}
 G.order=picks.map((_,i)=>picks[(i+G.first)%picks.length]);render();
 await modal(`<h2>Race ${G.n+1} of 4: ${G.board=='wild'?'Wild Wilds':'Mild Mile'}</h2><div class="hand">${G.order.map(cardO).join('')}</div>`,['Start race!']);
 const take=async r=>{G.ch=0;G.cl=0;let go=1;while(go&&!r.fin&&!r.out&&!G.over)go=await turn(r);if(G.cl)for(const b of alive().filter(x=>base(x)=='baby'))for(const o of alive())if(o!==b&&b.pos>0&&o.pos==b.pos)o.pos=b.pos-1;
  const m=Math.max(0,...G.rs.filter(x=>!x.out).map(x=>x.fin?FIN:x.pos));if(m>G.best){G.best=m;G.tc=0}else if(++G.tc>=20*G.order.length){log('♾️ 20 rounds with no progress: the race ends with no further points');G.over=1}};
 let i=0;while(!G.over){const r=G.order[i++%G.order.length];if(r.fin||r.out)continue;await take(r);
  while(G.sk&&!G.over){const s=G.sk;G.sk=null;if(s.fin||s.out)continue;await take(s);i=G.order.indexOf(s)+1}}
 render();const[a,b]=G.placed;if(a){G.pl[a.o].pts+=GOLD[G.n];G.winners.push(base(a))}if(b)G.pl[b.o].pts+=SIL[G.n];G.winners=G.winners.filter(x=>x!='egg'&&x!='twin');
 const lr=G.rs.filter(r=>!r.fin).sort((x,y)=>x.pos-y.pos)[0]||b||a;G.first=lr.o;G.n++;render();
 await modal(`<h2>Race ${G.n} complete!</h2>${a?`🥇 ${nm(a)} +${GOLD[G.n-1]}`:''}<br>${b?`🥈 ${nm(b)} +${SIL[G.n-1]}`:''}`,['Continue'])}
async function main(){const np=2+await modal(`<h2>MAGICAL ATHLETE</h2>How many players? (2–6)`,['2','3','4','5','6']);
 const hm=await modal(`<h2>${np} players</h2>How many are human? The rest are 🤖 CPU opponents.`,[...Array(np+1)].map((_,i)=>i));
 const ids=shuf(Object.keys(R));G={n:0,first:rnd(np),winners:[],deck:ids.slice(np*4).filter(x=>x!='egg'&&x!='twin'),pl:[...Array(np)].map((_,i)=>({n:i<hm?'Player '+(i+1):'CPU '+(i-hm+1),ai:i>=hm,col:NC[i],dc:PC[i],pts:0,hand:ids.slice(i*4,i*4+4)})),rs:[],placed:[]};
 while(G.n<4)await race();const m=Math.max(...G.pl.map(p=>p.pts)),w=G.pl.filter(p=>p.pts==m);
 await modal(`<h2>${w.length>1?'It’s a tie!':w[0].n+' wins!'}</h2>${G.pl.map(p=>`${p.n}: ${p.pts} pts`).join('<br>')}`,['Play again']);main()}
$('#spd').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id=='mu'){MUTE=!MUTE;b.textContent=MUTE?'🔇':'🔊';return}SPD=+b.dataset.s;[...$('#spd').children].forEach(x=>x.classList.toggle('on',x===b))};
$('#die').innerHTML=[1,2,3,4,5,6].map((n,i)=>`<i style="color:${['#e33','#27d','#2a4','#82c','#2a6','#d28'][i]};transform:${['','rotateY(90deg)','rotateX(90deg)','rotateX(-90deg)','rotateY(-90deg)','rotateY(180deg)'][i]} translateZ(40px)">${n}</i>`).join('');
// face order: 1 front,2 right,3 top,4 bottom,5 left,6 back (matches F map)
$('#die').querySelectorAll('i').forEach((e,i)=>e.style.transform=['','rotateY(90deg)','rotateX(90deg)','rotateX(-90deg)','rotateY(-90deg)','rotateY(180deg)'][i]+' translateZ(40px)');
main();
