<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magical Athlete</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--r:#f04c24;--p:#f27fe0;--y:#fbb31c;--g:#4a9b3c;--b:#2f9bf2;--u:#b57be8;--ink:#17121f}
*{box-sizing:border-box}body{margin:0;background:#1c1530;color:#fff;font:16px Fredoka,sans-serif}
h1,h2,.hd{font-family:'Lilita One',sans-serif;letter-spacing:.03em}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;flex-wrap:wrap;gap:8px}
h1{margin:0;font-size:30px;color:var(--y);-webkit-text-stroke:1px var(--r)}
#sc{display:flex;gap:10px}.pl{background:#2d2350;border-radius:12px;padding:6px 12px;border:3px solid var(--c)}.pl b{font-size:22px}
#wrap{overflow-x:auto;padding:0 12px}
#board{min-width:900px;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(4,70px);gap:4px;background:#000;border-radius:44px;padding:12px;border:4px solid #444}
.sq{border-radius:7px;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;position:relative;overflow:hidden;font:22px 'Lilita One';color:#fff}
.sq small{position:absolute;top:2px;left:5px;font-size:15px;text-shadow:0 1px #0008}.sq svg{margin:0 -5px}
.sq .ic{position:absolute;top:1px;width:100%;text-align:center;font-size:14px;color:#fff}
.mid{grid-area:2/1/4/15;display:flex;align-items:center;justify-content:center;font:70px 'Lilita One';color:#fff;-webkit-text-stroke:3px #111;paint-order:stroke fill;border-radius:20px;background:linear-gradient(#000 60%,var(--gr) 61%)}
.start{grid-area:1/1/2/4;background:var(--b);color:var(--r);font:italic 40px 'Lilita One';display:flex;align-items:center;justify-content:center;border-radius:30px 7px 7px 7px;position:relative}
#ctl{display:flex;gap:24px;align-items:center;justify-content:center;padding:14px;flex-wrap:wrap}
.scene{width:90px;height:90px;perspective:400px}.die{width:80px;height:80px;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.8,.3,1);margin:5px}
.die i{position:absolute;inset:0;background:var(--dc);border-radius:14px;border:2px solid #0003;display:flex;align-items:center;justify-content:center;font:normal 52px 'Lilita One';backface-visibility:hidden}
button{font:20px 'Lilita One';background:var(--y);color:var(--ink);border:0;border-radius:14px;padding:10px 22px;cursor:pointer;box-shadow:0 4px #a56a00}button:active{transform:translateY(3px);box-shadow:0 1px #a56a00}
#info{max-width:380px;font-size:18px}#strip{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:6px}.rc{background:#2d2350;border-radius:10px;padding:2px 10px;display:flex;align-items:center;gap:4px;border:2px solid var(--c)}
#log{max-width:700px;margin:6px auto;padding:0 20px;color:#c9bfe8;font-size:14px;list-style:none;min-height:90px}
#md{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9;overflow:auto}#md.on{display:flex}
.box{background:#2d2350;border-radius:20px;padding:22px;max-width:96vw;text-align:center}.bt{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.hand{display:flex;gap:12px;perspective:900px;flex-wrap:wrap;justify-content:center}
.card{width:170px;background:#fff8e8;color:var(--ink);border-radius:14px;padding:8px;border:5px solid var(--cc);transition:transform .25s;cursor:pointer;text-align:center;transform-style:preserve-3d}
.card:hover{transform:rotateY(10deg) rotateX(-8deg) translateY(-8px);box-shadow:-8px 14px 18px #0007}
.card .ch{font:22px 'Lilita One'}.art{border-radius:10px;padding:4px}.card i{font-size:11px;display:block;margin:4px 0}.card b{font:14px 'Lilita One';color:var(--r)}.card p{margin:3px 0;font-size:13px;font-weight:600}
</style></head><body>
<header><h1>MAGICAL ATHLETE</h1><div id="sc"></div></header>
<div id="wrap"><div id="board"></div></div>
<section id="ctl"><div class="scene"><div class="die" id="die"></div></div><div id="info"></div><button id="roll" style="display:none"></button></section>
<div id="strip"></div><ul id="log"></ul><div id="md"></div>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
// Fresh OS entropy on every call (crypto RNG, unbiased rejection sampling): never the same sequence twice, not seedable or predictable.
const rnd=n=>{const a=new Uint32Array(1),l=Math.floor(4294967296/n)*n;do crypto.getRandomValues(a);while(a[0]>=l);return a[0]%n};
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const FIN=30,GOLD=[2,3,4,5],SIL=[1,1,2,2]; // placeholder chip values: confirm with rulebook chip art
const COL={r:'#f04c24',p:'#f27fe0',y:'#fbb31c',g:'#4a9b3c',b:'#2f9bf2',u:'#b57be8'};
const WILD={1:{s:1},5:{t:1},7:{a:3},11:{a:1},13:{s:1},16:{a:-4},17:{t:1},23:{a:2},24:{a:-2},26:{t:1}};
const WCOL='.uygbupugbruyubruugbrpyuuruygb';
const R={
alch:{n:'Alchemist',c:'#e8a33a',o:'#7b3fa0',t:'Forever seeking the secret of turning This into That.',p:'TRANSMUTE ’N’ SCOOT',d:'When I roll a 1 or 2 for my main move, I move 4 instead.',x:'<path d="M14 8L30-14 46 8z" fill="#7b3fa0"/>'},
banana:{n:'Banana',c:'#ffd83a',o:'#7a5a10',t:'No more edible than you or I.',p:'THE SLIP',d:'I trip any racer that passes me.',x:'<path d="M30 6Q34-8 44-8" stroke="#5a3d10" stroke-width="5" fill="none"/>'},
centaur:{n:'Centaur',c:'#b07a4a',o:'#4a2d12',t:'Here’s the kicker.',p:'HOOFWHACK',d:'When I pass a racer, they move backwards 2.',x:'<path d="M14 8L6-8M46 8L54-8" stroke="#4a2d12" stroke-width="5"/>'},
coach:{n:'Coach',c:'#5fbf5f',o:'#1d5a1d',t:'Believing in yourself is even more important when you are some kind of lizard.',p:'GOOD HUSTLE',d:'Everyone on my space gets +1 to their main move, including me.',x:'<path d="M8 14Q30-14 52 14z" fill="#e33"/><rect x="16" y="72" width="28" height="8" rx="4" fill="#fff"/>'},
gunk:{n:'Gunk',c:'#9acd32',o:'#4a6a10',t:'A bit of a hugger.',p:'GOOP ’EM',d:'Other racers get -1 to their main move.',x:'<circle cx="14" cy="80" r="6" fill="#bde04a"/><circle cx="46" cy="84" r="5" fill="#bde04a"/>'},
hare:{n:'Hare',c:'#4fb6f0',o:'#1c5f8f',t:'The only thing he can’t outrun is hubris.',p:'HUBRIS',d:'I get +2 to my main move. When I start my turn alone in the lead, I skip my main move.',x:'<ellipse cx="20" cy="-2" rx="6" ry="14" fill="#4fb6f0" stroke="#1c5f8f" stroke-width="3"/><ellipse cx="40" cy="-2" rx="6" ry="14" fill="#4fb6f0" stroke="#1c5f8f" stroke-width="3"/>'},
legs:{n:'Legs',c:'#ffb3d9',o:'#c03a8a',t:'Has arms, too, but who cares.',p:'JOG',d:'I can skip rolling for my main move and move 5 instead.',x:'<path d="M6 70h48M6 78h48" stroke="#c03a8a" stroke-width="3"/>'},
lackey:{n:'Lackey',c:'#f5a31c',o:'#8a4a00',t:'If you’re happy, he’s happy.',p:'VERY GOOD SIRE',d:'When another racer rolls a 6 for their main move, I move 2 first.',x:'<path d="M30 66L18 58v16zM30 66l12-8v16z" fill="#e33"/>'},
loser:{n:'Loveable Loser',c:'#c9a0dc',o:'#5b2c7a',t:'Top of her class at Loser Academy. Which is bad.',p:'D’AWW',d:'At the start of my turn, I get 1 point chip if I’m alone in last place.',x:'<circle cx="14" cy="50" r="3.5" fill="#3af"/>'},
cheer:{n:'Cheerleader',c:'#ff7ab8',o:'#a01c64',t:'A being of pure pep.',p:'RAH RAH',d:'At the start of my turn, I make the racers in last place move 2. If I do, I move 1.',x:'<circle cx="6" cy="62" r="8" fill="#ffe14a"/><circle cx="54" cy="62" r="8" fill="#ffe14a"/>'},
inch:{n:'Inchworm',c:'#ff8fd0',o:'#6a2ea8',t:'Give her an inch and she’ll take an inch.',p:'WRIGGLE',d:'When another racer rolls a 1 for their main move, they skip that move and I move 1.',x:'<circle cx="30" cy="72" r="6" fill="#6a2ea8"/><circle cx="14" cy="78" r="5" fill="#6a2ea8"/>'},
rocket:{n:'Rocket Scientist',c:'#e8e8f0',o:'#d33',t:'Moonlights as a brain surgeon.',p:'KABLOOEY',d:'I roll THEN decide whether to double my main move roll. When I do, I trip.',x:'<path d="M30-14L40 6H20z" fill="#d33"/>'}};
const pawn=(id,w=46)=>{const r=R[id];return `<svg viewBox="0 -16 60 106" width="${w}"><path d="M6 88V32Q6 4 30 4T54 32V88Z" fill="${r.c}" stroke="${r.o}" stroke-width="5" stroke-linejoin="round"/><circle cx="22" cy="34" r="8" fill="#fff"/><circle cx="40" cy="34" r="8" fill="#fff"/><circle cx="24" cy="36" r="3.5" fill="#222"/><circle cx="38" cy="36" r="3.5" fill="#222"/><path d="M20 54Q31 66 42 54" stroke="#222" stroke-width="3" fill="none"/>${r.x}</svg>`};
const card=id=>`<div class="card" data-id="${id}" style="--cc:${R[id].o}"><div class="ch">${R[id].n}</div><div class="art" style="background:${R[id].c}55">${pawn(id,70)}</div><i>${R[id].t}</i><b>${R[id].p}</b><p>${R[id].d}</p></div>`;
const PC=['#f5a7d6','#fecc3a','#f58a1f'],NC=['#c4a','#2a7','#38f','#e22','#82c','#e6a'];
const modal=(h,b)=>new Promise(res=>{const m=$('#md');m.className='on';m.innerHTML=`<div class="box">${h}<div class="bt">${b.map((t,i)=>`<button data-i="${i}">${t}</button>`).join('')}</div></div>`;m.onclick=e=>{const i=e.target.dataset.i;if(i!=null){m.className='';m.innerHTML='';res(+i)}}});
const pickCard=p=>new Promise(res=>{const m=$('#md');m.className='on';m.innerHTML=`<div class="box"><h2>${p.n}: choose your racer</h2><div class="hand">${p.hand.map(card).join('')}</div></div>`;m.onclick=e=>{const c=e.target.closest('.card');if(c){m.className='';m.innerHTML='';res(c.dataset.id)}}});
let G;const log=t=>{const l=$('#log');l.insertAdjacentHTML('afterbegin',`<li>${t}</li>`);while(l.children.length>7)l.lastChild.remove()};
const alive=()=>G.rs.filter(r=>!r.fin),own=r=>G.pl[r.o],nm=r=>`${R[r.id].n} (${own(r).n})`,has=(id,ex)=>alive().filter(o=>o.id==id&&o!==ex);
function render(){
 const wild=G.board=='wild';let h=`<div class="start">START</div><div class="mid" style="--gr:${wild?'#6b3fb0':'#4a9b3c'}">${wild?'WILD WILDS':'MILD MILE'}</div>`;
 for(let i=1;i<FIN;i++){let row,col;if(i<=12){row=1;col=i+3}else if(i<=14){row=i-11;col=15}else{row=4;col=30-i}
  const s=wild&&WILD[i],k=wild?WCOL[i]:'rpygb'[i%5],lab=wild?(s?(s.s?'★1':s.t?'TRIP!':(s.a>0?'→':'←')+Math.abs(s.a)):''):(i%5==0?i:'');
  h+=`<div class="sq" style="grid-area:${row}/${col};background:${COL[k]}">${lab?`<span class="ic">${lab}</span>`:''}${alive().concat(G.placed).filter(r=>r.pos==i).map(r=>`<span style="opacity:${r.trip?.45:1};transform:${r.trip?'rotate(90deg)':''}">${pawn(r.id,34)}</span>`).join('')}</div>`}
 const st=G.rs.concat().filter(r=>r.pos==0&&!r.fin);$('#board').innerHTML=h.replace('START</div>','START</div>'.replace('<','<'))+'';
 if(st.length)$('#board .start').insertAdjacentHTML('beforeend',st.map(r=>pawn(r.id,34)).join(''));
 $('#sc').innerHTML=G.pl.map(p=>`<div class="pl" style="--c:${p.col}">${p.n}<br><b>${p.pts}</b> pts</div>`).join('');
 $('#strip').innerHTML=G.rs.map(r=>`<div class="rc" style="--c:${own(r).col}">${pawn(r.id,22)}${R[r.id].n}${r.trip?' 🌀tripped':''}${r.fin?' #'+r.fin:''}</div>`).join('')}
const F={1:[0,0],2:[0,-90],5:[0,90],6:[0,180],3:[-90,0],4:[90,0]};let cum=0;
async function rollDie(p){const v=rnd(6)+1,d=$('#die');d.style.setProperty('--dc',p.dc);cum+=720;const[x,y]=F[v];d.style.transform=`rotateX(${x+cum}deg) rotateY(${y+cum}deg)`;await sleep(1100);return v}
function finish(r){r.fin=G.placed.length+1;G.placed.push(r);log(`🏁 ${nm(r)} finishes in place ${r.fin}!`);if(G.placed.length>=2)G.over=1;else if(alive().length<=1){const l=alive()[0];if(l){l.fin=2;G.placed.push(l);G.over=1}}}
async function mv(r,d){if(!d||r.fin||G.over)return;const a=r.pos,b=Math.max(0,a+d);r.pos=Math.min(b,FIN);
 const ps=alive().filter(o=>o!==r&&(d>0?o.pos>a&&o.pos<b:o.pos<a&&o.pos>b));render();await sleep(450);
 if(b>=FIN){finish(r);render();return}
 for(const o of ps){if(o.id=='banana'){r.trip=1;log(`🍌 ${nm(r)} slips on Banana and trips!`)}if(o.id=='centaur'){log(`🐴 Centaur hoofwhacks ${nm(r)}!`);r.pos=Math.max(0,r.pos-2)}}render()}
async function land(r,n=0){if(r.fin||G.over)return;const s=G.board=='wild'&&WILD[r.pos];if(!s)return;
 if(s.s){own(r).pts++;log(`★ ${nm(r)} takes a bronze point chip`)}if(s.t){r.trip=1;log(`🌀 ${nm(r)} trips!`)}
 if(s.a&&n<6){log(`${nm(r)} follows the arrow (${s.a>0?'+':''}${s.a})`);await mv(r,s.a);await land(r,n+1)}}
async function turn(r){const p=own(r);render();$('#info').innerHTML=`<span class="hd" style="font-size:26px;color:${p.col}">${p.n}</span><br>${pawn(r.id,40)} ${R[r.id].n}`;
 const rs=alive(),mn=Math.min(...rs.map(o=>o.pos)),mx=Math.max(...rs.map(o=>o.pos));
 const bt=$('#roll');bt.style.display='';bt.textContent=r.trip?'Recover (skip move)':'ROLL!';await new Promise(ok=>bt.onclick=ok);bt.style.display='none';
 const lastAlone=r.pos==mn&&rs.filter(o=>o.pos==mn).length==1;
 if(r.id=='loser'&&lastAlone){p.pts++;log(`💜 ${nm(r)} collects a point chip`)}
 if(r.id=='cheer'){const ls=rs.filter(o=>o.pos==mn);log('📣 Cheerleader cheers for last place!');for(const o of ls)await mv(o,2);await mv(r,1)}
 if(r.id=='hare'&&r.pos==mx&&rs.filter(o=>o.pos==mx).length==1&&!r.trip){log('🐇 Hare is alone in the lead: hubris! Skips main move');return}
 if(r.trip){r.trip=0;log(`${nm(r)} recovers from the trip and skips their main move`);render();return}
 let roll,amt;
 if(r.id=='legs'&&await modal(`<h2>Legs: JOG?</h2>Skip rolling and move 5?`,['Jog (move 5)','Roll normally'])==0){amt=5;log('🏃 Legs jogs 5')}
 else{roll=await rollDie(p);log(`${nm(r)} rolled a ${roll}`);amt=roll;
  if(r.id=='alch'&&roll<3){amt=4;log('⚗️ Alchemist transmutes the roll into 4')}
  if(r.id=='rocket'&&await modal(`<h2>Rocket Scientist rolled ${roll}</h2>Kablooey: double it to ${roll*2} (and trip)?`,['Kablooey!','No thanks'])==0){amt=roll*2;r.trip=1}
  for(const l of has('lackey',r))if(roll==6){log('Lackey hustles 2 first');await mv(l,2)}
  const iw=has('inch',r)[0];if(roll==1&&iw){log('🐛 Inchworm wriggles; roll of 1 is skipped');await mv(iw,1);return}}
 if(r.id=='hare')amt+=2;amt+=alive().filter(o=>o.id=='coach'&&o.pos==r.pos).length;amt-=has('gunk',r).length;amt=Math.max(0,amt);
 log(`${nm(r)} moves ${amt}`);await mv(r,amt);await land(r)}
async function race(){G.over=0;G.placed=[];G.board=G.n%2?'wild':'mild';$('#log').innerHTML='';
 const picks=[];for(let i=0;i<G.pl.length;i++){const p=G.pl[i];await modal(`<h2>${p.n}</h2>Pass the device: only ${p.n} should look!`,[`I’m ${p.n}`]);const id=await pickCard(p);p.hand=p.hand.filter(h=>h!=id);picks.push({id,o:i,pos:0,trip:0,fin:0})}
 G.rs=picks;let f=G.first;G.order=G.rs.map((_,i)=>G.rs[(i+f)%G.rs.length]);G.rs=G.order.concat();
 await modal(`<h2>Race ${G.n+1} of 4: ${G.board=='wild'?'Wild Wilds':'Mild Mile'}</h2><div class="hand">${G.rs.map(r=>card(r.id)).join('')}</div>`,['Start race!']);
 while(!G.over)for(const r of G.order){if(r.fin)continue;await turn(r);if(G.over)break}
 render();const[a,b]=G.placed;G.pl[a.o].pts+=GOLD[G.n];G.pl[b.o].pts+=SIL[G.n];
 const lastR=G.rs.filter(r=>!r.fin).sort((x,y)=>x.pos-y.pos)[0]||b;G.first=lastR.o;G.n++;render();
 await modal(`<h2>Race ${G.n} complete!</h2>🥇 ${nm(a)} +${GOLD[G.n-1]}<br>🥈 ${nm(b)} +${SIL[G.n-1]}`,['Continue'])}
async function main(){const np=2+await modal(`<h2>MAGICAL ATHLETE</h2>Hot-seat game: how many players?`,['2 players','3 players']);
 const ids=shuf(Object.keys(R));G={n:0,first:rnd(np),pl:[...Array(np)].map((_,i)=>({n:'Player '+(i+1),col:NC[i],dc:PC[i],pts:0,hand:ids.slice(i*4,i*4+4)})),rs:[],placed:[]};
 while(G.n<4)await race();const m=Math.max(...G.pl.map(p=>p.pts)),w=G.pl.filter(p=>p.pts==m);
 await modal(`<h2>${w.length>1?'It’s a tie!':w[0].n+' wins!'}</h2>${G.pl.map(p=>`${p.n}: ${p.pts} pts`).join('<br>')}`,['Play again']);main()}
$('#die').innerHTML=[1,2,3,4,5,6].map((n,i)=>`<i style="color:${['#e33','#27d','#2a4','#82c','#2a6','#d28'][i]};transform:${['','rotateY(90deg)','rotateX(90deg)','rotateX(-90deg)','rotateY(-90deg)','rotateY(180deg)'][i]} translateZ(40px)">${n}</i>`).join('');
// face order: 1 front,2 right,3 top,4 bottom,5 left,6 back (matches F map)
$('#die').querySelectorAll('i').forEach((e,i)=>e.style.transform=['','rotateY(90deg)','rotateX(90deg)','rotateX(-90deg)','rotateY(-90deg)','rotateY(180deg)'][i]+' translateZ(40px)');
main();
</script></body></html>
